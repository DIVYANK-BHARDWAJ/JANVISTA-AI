services:
  # 1. Flask Python Backend
  - type: web
    name: janvista-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false

  # 2. Next.js Node Frontend
  - type: web
    name: janvista-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: janvista-backend
          type: web
          property: host
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
