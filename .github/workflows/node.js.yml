name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Node project
        id: project
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet; JANVISTA application bootstrap is not present on this branch."
          fi

      - name: Use Node.js
        if: steps.project.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        if: steps.project.outputs.exists == 'true'
        run: npm ci

      - name: Build
        if: steps.project.outputs.exists == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.project.outputs.exists == 'true'
        run: npm test
