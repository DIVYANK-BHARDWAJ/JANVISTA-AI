name: JANVISTA Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Static Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Node project
        id: project
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Setup Node
        if: steps.project.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install dependencies
        if: steps.project.outputs.exists == 'true'
        run: npm ci
      - name: TypeScript typecheck
        if: steps.project.outputs.exists == 'true'
        run: npm run typecheck --if-present
      - name: ESLint
        if: steps.project.outputs.exists == 'true'
        run: npm run lint --if-present
      - name: Prettier check
        if: steps.project.outputs.exists == 'true'
        continue-on-error: true
        run: npx prettier . --check
